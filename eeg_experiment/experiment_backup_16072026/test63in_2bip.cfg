;REFA8 EEG Axquisition Software
;qrefa
; Achtung !!! nur mit Adapter def63in_2bip zu verwenden. !!!


[acquisition settings]
rate            500   ; Hz   ( 125, 250, 500, 1000 oder 2000)
;imp_limit        5   ; KOhm ( ... )   NOT YET IMPLEMENTED
;cal_voltage    100   ; uV   ( ... )   NOT YET IMPLEMENTED


[channel defaults]
unit               uV    ; physikalische Einheit
gain              1.0    ; zusaetzliche Vorverstaerkung
units_per_cm      500    ; vertikale Achsenskalierung (Einheiten pro cm; i.a. uV/cm)
seconds_per_cm    2.0    ; horizontale Achsenskalierung (Sekunden pro cm)


;cnt_ref  A1
cnt_ref  Cz


